<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Game</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      body {
        margin: 0;
        background: #1a1a2e;
      }

      /* 로그인 화면 */
      #login-screen {
        position: fixed;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        z-index: 100;
      }

      #login-screen h1 {
        color: white;
        font-size: 48px;
        margin-bottom: 40px;
        font-family: sans-serif;
      }

      .oauth-btn {
        width: 280px;
        height: 56px;
        margin: 8px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: bold;
      }

      .btn-google {
        background: white;
        color: #333;
      }
      .btn-kakao {
        background: #fee500;
        color: #3c1e1e;
      }
      .btn-naver {
        background: #03c75a;
        color: white;
      }

      #status {
        color: #aaa;
        margin-top: 20px;
        font-family: sans-serif;
      }

      /* Unity 캔버스 */
      #unity-container {
        display: none;
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- 로그인 화면 -->
    <div id="login-screen">
      <h1>My Game</h1>
      <button class="oauth-btn btn-google" onclick="loginWith('google')">
        🔵 Google로 시작하기
      </button>
      <button class="oauth-btn btn-kakao" onclick="loginWith('kakao')">
        💛 카카오로 시작하기
      </button>
      <button class="oauth-btn btn-naver" onclick="loginWith('naver')">
        🟢 네이버로 시작하기
      </button>
      <p id="status"></p>
    </div>

    <!-- Unity 캔버스 (로그인 후 표시) -->
    <div id="unity-container">
      <canvas id="unity-canvas" style="width: 100%; height: 100%"></canvas>
    </div>

    <script src="Build/MyGame.loader.js"></script>
    <script>
      const BACKEND_URL = "https://your-backend.com";
      let unityInstance = null;
      let authToken = null;

      // 페이지 로드 시 저장된 토큰 확인
      window.addEventListener("load", function () {
        const savedToken = localStorage.getItem("auth_token");
        if (savedToken) {
          setStatus("이전 세션 확인 중...");
          verifyToken(savedToken).then((valid) => {
            if (valid) {
              authToken = savedToken;
              loadUnity(authToken);
            } else {
              localStorage.removeItem("auth_token");
              setStatus("");
            }
          });
        }

        // URL에 token 파라미터가 있는 경우 (OAuth 콜백)
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get("token");
        if (tokenFromUrl) {
          authToken = tokenFromUrl;
          localStorage.setItem("auth_token", authToken);
          // URL에서 토큰 제거 (보안)
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname,
          );
          loadUnity(authToken);
        }
      });

      // OAuth 로그인 시작
      function loginWith(provider) {
        setStatus(`${provider} 로그인 중...`);
        // 현재 탭을 FastAPI 로그인 URL로 리다이렉트
        window.location.href = `${BACKEND_URL}/api/auth/login/${provider}`;
      }

      // 토큰 검증
      async function verifyToken(token) {
        try {
          const res = await fetch(`${BACKEND_URL}/api/auth/verify`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          return data.valid;
        } catch {
          return false;
        }
      }

      // Unity 로드
      function loadUnity(token) {
        setStatus("게임 로딩 중...");
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("unity-container").style.display = "block";

        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: "Build/MyGame.data",
          frameworkUrl: "Build/MyGame.framework.js",
          codeUrl: "Build/MyGame.wasm",
        }).then((instance) => {
          unityInstance = instance;

          // Unity가 완전히 로드된 후 토큰 주입
          // Unity 측에서 준비 완료 신호를 보내면 전달
        });
      }

      // Unity에서 준비 완료 신호를 받아 토큰 전달 (jslib을 통해 호출됨)
      function onUnityReady() {
        if (unityInstance && authToken) {
          unityInstance.SendMessage(
            "Managers",
            "OnReceiveAuthToken",
            authToken,
          );
        }
      }

      // 로그아웃 (Unity에서 호출 가능)
      function logoutFromPage() {
        localStorage.removeItem("auth_token");
        unityInstance = null;
        authToken = null;

        document.getElementById("unity-container").style.display = "none";
        document.getElementById("login-screen").style.display = "flex";
        setStatus("로그아웃되었습니다.");
      }

      function setStatus(msg) {
        document.getElementById("status").textContent = msg;
      }
    </script>
  </body>
</html>
